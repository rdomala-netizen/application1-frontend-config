apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: rdomala/application1-frontend:v1.0.0 
          ports:
            - containerPort: 5000
          env:
            - name: BACKEND_URL
              value: http://backend:5001
          readinessProbe:
            httpGet: { path: /healthz, port: 5000 }
          livenessProbe:
            httpGet: { path: /healthz, port: 5000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
